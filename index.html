<style>
  :root {
    --ground: #f4f5f2;
    --surface: #ffffff;
    --ink: #161a17;
    --muted: #5f6861;
    --rule: #d9ddd6;
    --accent: #2b4acb;
    --live: #1e9e5a;
    --building: #b7791f;
    --tile-l: 86%;
    --tile-ink: 28%;
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #111412; --surface: #181c19; --ink: #e9ece7; --muted: #9aa39c;
      --rule: #2a302b; --accent: #8ea2ff; --live: #3ddc84; --building: #e0a84a;
      --tile-l: 22%; --tile-ink: 78%;
    }
  }
  :root[data-theme="dark"] {
    --ground: #111412; --surface: #181c19; --ink: #e9ece7; --muted: #9aa39c;
    --rule: #2a302b; --accent: #8ea2ff; --live: #3ddc84; --building: #e0a84a;
    --tile-l: 22%; --tile-ink: 78%;
  }

  body { background: var(--ground); color: var(--ink); font: 16px/1.55 var(--body); }
  .wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 72px 96px; }

  header { display: grid; gap: 14px; margin-bottom: 56px; max-width: 46rem; }
  .eyebrow { margin: 0; font: 500 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font: 800 clamp(44px, 9vw, 104px)/.92 var(--display); letter-spacing: -.035em; text-wrap: balance; }
  .lede { margin: 0; font-size: 19px; color: var(--muted); max-width: 36rem; }
  .tally { margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font: 14px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .tally b { color: var(--ink); font-weight: 500; }
  .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--live); margin-right: 8px; box-shadow: 0 0 0 0 var(--live); animation: pulse 2.4s infinite; vertical-align: 1px; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }


  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 28px; }

  .site { display: grid; gap: 14px; color: inherit; text-decoration: none; border-radius: 10px; outline-offset: 6px; }
  .site:focus-visible { outline: 2px solid var(--accent); }

  .shot { border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--surface); transition: transform .25s ease, box-shadow .25s ease; }
  .site:hover .shot { transform: translateY(-4px); box-shadow: 0 14px 30px -18px rgb(0 0 0 / .35); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--rule); }
  .dots { display: flex; gap: 5px; flex: none; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--rule); }
  .addr { flex: 1; min-width: 0; padding: 3px 10px; border-radius: 99px; background: var(--ground); font: 12px/1.4 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .addr::before { content: "↗ "; color: var(--accent); }
  .face { aspect-ratio: 16 / 9; max-width: 100%; display: grid; place-items: center; background: hsl(var(--h) 38% var(--tile-l)); }
  .face img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .mono { font: 800 clamp(48px, 8vw, 72px)/1 var(--display); letter-spacing: -.04em; color: hsl(var(--h) 45% var(--tile-ink)); }

  .meta { display: grid; gap: 6px; padding-inline: 2px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h2 { margin: 0; font: 500 24px/1.15 var(--display); letter-spacing: -.01em; }
  .site:hover h2 { color: var(--accent); }
  .status { flex: none; font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
  .status::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }
  .status.live { color: var(--live); }
  .status.building { color: var(--building); }
  .about { margin: 0; color: var(--muted); }
  .stack { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .stack li { font: 12px/1 var(--mono); padding: 5px 8px; border: 1px solid var(--rule); border-radius: 4px; color: var(--muted); }
  .year { font: 12px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

  footer { margin-top: 80px; padding-top: 20px; border-top: 1px solid var(--rule); font: 13px/1.5 var(--mono); color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .pulse { animation: none; }
    .shot { transition: none; }
    .site:hover .shot { transform: none; }
  }
</style>
</head>

  const SITES = [

  const initials = s => s.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
  const domain = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } };

  document.getElementById("sites").innerHTML = SITES.map(s => `

        <div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="addr">${esc(domain(s.url))}</span></div>
