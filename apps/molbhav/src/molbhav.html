<title>Molbhav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: navy shell bar across the top, white side navigation with icons on the left, grey work area with white panels; records open in a right-hand panel */
  --bg:#F3F5F8; --surface:#FFFFFF; --sunken:#EEF1F5; --ink:#1B2532; --ink-2:#465365; --ink-3:#687485;
  --line:#DCE1E8; --line-2:#C3CBD5;
  --accent:#0A6BC8; --accent-ink:#FFFFFF; --accent-soft:#E3EEFB;
  --shell:#15253A; --shell-ink:#F2F5F9; --shell-2:#23374F; --shell-3:#A3B4C8; --shell-accent:#6FB1F2;
  --brass:#8C5B00; --brass-soft:#FFF3D9;
  --good:#1D7A3E; --good-soft:#E3F3E8; --warn:#A95A00; --warn-soft:#FFF0DB; --crit:#BF2A1F; --crit-soft:#FCE6E4;
  --scrim:rgba(15,25,38,.42); --shadow:0 8px 28px rgba(16,27,41,.18);
  --f-body:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-display:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px; --r-sm:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151C; --surface:#18202A; --sunken:#212A35; --ink:#E5EAF0; --ink-2:#AEB9C6; --ink-3:#8692A1;
    --line:#2A3440; --line-2:#3A4654;
    --accent:#5AA6EE; --accent-ink:#0A1420; --accent-soft:#18304A;
    --shell:#0A1118; --shell-ink:#E5EAF0; --shell-2:#1A2531; --shell-3:#8C9BAE; --shell-accent:#6FB1F2;
    --brass:#E3B15A; --brass-soft:#33280F;
    --good:#6DCB8D; --good-soft:#163022; --warn:#E6A84E; --warn-soft:#38290F; --crit:#F2867C; --crit-soft:#3C1C19;
    --scrim:rgba(0,0,0,.58); --shadow:0 8px 28px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#18202A; --sunken:#212A35; --ink:#E5EAF0; --ink-2:#AEB9C6; --ink-3:#8692A1;
  --line:#2A3440; --line-2:#3A4654;
  --accent:#5AA6EE; --accent-ink:#0A1420; --accent-soft:#18304A;
  --shell:#0A1118; --shell-ink:#E5EAF0; --shell-2:#1A2531; --shell-3:#8C9BAE; --shell-accent:#6FB1F2;
  --brass:#E3B15A; --brass-soft:#33280F;
  --good:#6DCB8D; --good-soft:#163022; --warn:#E6A84E; --warn-soft:#38290F; --crit:#F2867C; --crit-soft:#3C1C19;
  --scrim:rgba(0,0,0,.58); --shadow:0 8px 28px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance}

/* shell */
.app{display:flex;flex-direction:column;min-height:100vh}
.shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;height:52px;background:var(--shell);color:var(--shell-ink);display:flex;align-items:center;gap:16px;padding:0 16px}
.sh-left{display:flex;align-items:center;gap:10px;min-width:0;flex:none}
.logo{display:grid;place-items:center;color:var(--shell-accent)}
.logo svg{width:22px;height:22px}
.prod{font-weight:700;font-size:16px;letter-spacing:.01em;white-space:nowrap}
.sh-co{font-size:12.5px;color:var(--shell-3);border-left:1px solid var(--shell-2);padding-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.search{position:relative;flex:1 1 360px;max-width:560px;margin:0 auto;min-width:0}
.search .s-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:var(--shell-3);stroke-width:2;stroke-linecap:round;pointer-events:none}
.search input{background:var(--shell-2);border:1px solid transparent;color:var(--shell-ink);border-radius:var(--r-sm);padding:7px 12px 7px 34px;font-size:13.5px}
.search input::placeholder{color:var(--shell-3)}
.search input:focus{outline:2px solid var(--shell-accent);outline-offset:0}
.sh-right{display:flex;align-items:center;gap:10px;flex:none}
.demo-back{white-space:nowrap}
.shell .btn.ghost.demo-back{color:var(--shell-ink);border-color:rgba(255,255,255,.22)}
.shell .btn.ghost.demo-back:hover{background:var(--shell-2)}
@media (max-width:1500px){.nav a{padding:0 10px}.nav a > svg{display:none}}
@media (max-width:720px){.demo-back{display:none}}
.qchip{font-size:12px;color:var(--shell-ink);background:var(--shell-2);border-radius:var(--r-sm);padding:5px 10px;white-space:nowrap}
.drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);z-index:30;padding:6px;max-height:60vh;overflow:auto}
.drop button{display:flex;width:100%;text-align:left;gap:10px;justify-content:space-between;align-items:baseline;border:0;background:transparent;padding:8px 10px;border-radius:var(--r-sm);color:var(--ink);cursor:pointer}
.drop button:hover{background:var(--sunken)}
.drop .k{font-size:11.5px;color:var(--ink-3);flex:none}
.drop .ask{border-top:1px solid var(--line);margin-top:4px;padding-top:10px;color:var(--accent);font-weight:600}

/* top tabs */
.tabs{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:24;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,27,41,.06)}
.nav{display:flex;align-items:stretch;gap:0;max-width:1560px;margin:0 auto;padding:0 12px;overflow-x:auto;scrollbar-width:thin}
.nav-sep{width:1px;background:var(--line);margin:12px 8px;flex:none}
.nav a{display:flex;align-items:center;gap:8px;padding:0 12px;height:46px;color:var(--ink-2);text-decoration:none;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;border-top:3px solid transparent;flex:none}
.nav a svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav a:hover{color:var(--accent);background:var(--sunken);text-decoration:none}
.nav a[aria-current="page"]{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}
.nav a[aria-current="page"] svg{opacity:1}
.count{font-size:11px;font-variant-numeric:tabular-nums;padding:0 6px;border-radius:99px;background:var(--sunken);color:var(--ink-2);font-weight:700;line-height:18px}
.count.crit{background:var(--crit);color:var(--surface)}
.nav a[aria-current="page"] .count{background:var(--accent);color:var(--accent-ink)}
.work{flex:1;min-width:0;padding:20px 24px 48px}
#view{max-width:1400px;margin:0 auto}

/* page header */
.crumb{font-size:12.5px;color:var(--ink-3);margin-bottom:4px}
.crumb b{font-weight:500;color:var(--ink-2)}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin:0 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;box-shadow:0 1px 2px rgba(16,27,41,.05)}
.page-h h1{font-size:22px;font-weight:600;line-height:1.2;margin:0}
.page-h .sub{color:var(--ink-3);font-size:13px;margin-top:4px;max-width:80ch}
.page-h .acts{margin:0}

/* controls */
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:7px 9px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:1px solid var(--accent);outline-offset:0}
textarea{resize:vertical;line-height:1.45}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input.mono,.mono{font-family:var(--f-mono);font-size:12.5px}
.btn{font-weight:600;font-size:13.5px;line-height:1.2;padding:7px 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--accent);cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--sunken);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunken)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line-2))}
.btn.danger.solid{background:var(--crit);border-color:var(--crit);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1 1 220px}
.bar select{width:auto;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:var(--surface);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* tables */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(16,27,41,.05)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font-weight:600;font-size:12.5px;color:var(--ink-2);background:var(--sunken);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t tbody tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--accent-soft)}
.t tr.sub td{background:var(--sunken);font-weight:600}
.t tr.total td{font-weight:700;border-top:2px solid var(--line-2)}
.t tr.dim td{opacity:.55}
.t input,.t select{padding:4px 6px;font-size:13px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--ink-3)}
.strong{font-weight:600}
.small{font-size:12.5px}

/* tags and badges */
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:var(--r-sm);font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunken);color:var(--ink-2);line-height:1.6}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.brass{background:var(--brass-soft);color:var(--brass)}
.score{display:inline-grid;place-items:center;min-width:36px;height:22px;padding:0 6px;border-radius:var(--r-sm);font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px}
.score.hot{background:var(--good-soft);color:var(--good)}
.score.warm{background:var(--warn-soft);color:var(--warn)}
.score.cold{background:var(--sunken);color:var(--ink-3)}
.grade{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.grade.A{background:var(--good-soft);color:var(--good)}
.grade.B{background:var(--accent-soft);color:var(--accent)}
.grade.C{background:var(--warn-soft);color:var(--warn)}
.grade.D{background:var(--crit-soft);color:var(--crit)}

/* overview */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;box-shadow:0 1px 2px rgba(16,27,41,.05)}
.kpi .lbl{font-size:12.5px;color:var(--ink-2);font-weight:600}
.kpi .val{font-size:28px;font-weight:600;line-height:1.15;margin-top:8px;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi .note{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.meter{height:6px;background:var(--sunken);border-radius:99px;overflow:hidden;margin-top:10px}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.warn>i{background:var(--warn)}
.meter.crit>i{background:var(--crit)}
.meter.thin{height:4px;margin-top:6px;width:90px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:16px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;box-shadow:0 1px 2px rgba(16,27,41,.05)}
.panel h2{font-size:15.5px;font-weight:600;margin:0 0 2px;padding-bottom:0}
.panel .ph-sub{font-size:12.5px;color:var(--ink-3);margin:0 0 12px}
.list{list-style:none;margin:0;padding:0}
.list li+li{border-top:1px solid var(--line)}
.li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;width:100%;text-align:left;background:transparent;border:0;padding:9px 4px;color:var(--ink);cursor:pointer}
.li:hover{background:var(--sunken)}
.li .t1{font-weight:600}
.li .t2{font-size:12.5px;color:var(--ink-3)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--ink-3)}
.dot.crit{background:var(--crit)}
.dot.warn{background:var(--warn)}
.dot.good{background:var(--good)}
.hbar{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.hbar .track{height:14px;background:var(--sunken);border-radius:3px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent)}

/* pipeline board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunken);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.col.over{outline:2px dashed var(--accent);outline-offset:-3px}
.col-h{display:flex;flex-direction:column;gap:2px;padding:2px 2px 8px;border-bottom:1px solid var(--line-2)}
.col-h .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.col-h b{font-size:14px;font-weight:600}
.col-h .sum{font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px}
.col-h .meta{font-size:12px;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 2px rgba(16,27,41,.06)}
.card:hover{border-color:var(--accent)}
.card[draggable="true"]{cursor:grab}
.card .nm{font-weight:600;line-height:1.3;color:var(--accent)}
.card .acc{font-size:12.5px;color:var(--ink-3);margin-top:-3px}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px}
.card .amt{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.flags{display:flex;flex-wrap:wrap;gap:4px}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunken);color:var(--ink-2);font-size:10.5px;font-weight:700;flex:none}
.card .av{background:var(--accent-soft);color:var(--accent)}

/* record panel */
#drawer{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end}
#drawer[hidden]{display:none}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:min(660px,100%);height:100%;background:var(--bg);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .16s ease-out}}
@keyframes slide{from{transform:translateX(24px)}to{transform:none}}
.sheet-top{display:flex;justify-content:flex-end;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
#drawer-body{overflow-y:auto;padding:16px 20px 32px;flex:1;min-height:0}
.dh .eyebrow{font-size:12px;color:var(--ink-3);font-weight:600}
.dh h2{font-size:20px;font-weight:600;margin:2px 0 8px;line-height:1.25}
.dh .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink-2);font-size:13px;align-items:center}
.bigamt{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin:12px 0 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.bigamt .muted{font-size:13px;font-weight:400}
.sec{margin-top:18px}
.sec>h3{font-size:13px;color:var(--ink-2);margin:0 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.box.flush{padding:0;overflow-x:auto}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;font-size:13.5px;margin:0}
.dl dt{color:var(--ink-3)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.mini .lbl{font-size:12px;color:var(--ink-3);font-weight:600}
.mini .v{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;margin-top:2px}
.path{display:flex;gap:2px;overflow-x:auto;padding-bottom:2px}
.path button{flex:1 0 auto;border:0;padding:8px 16px 8px 20px;font-size:12.5px;font-weight:600;background:var(--sunken);color:var(--ink-2);cursor:pointer;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,0 100%,9px 50%)}
.path button:first-child{clip-path:polygon(0 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,0 100%);padding-left:14px;border-radius:4px 0 0 4px}
.path button.done{background:var(--accent-soft);color:var(--accent)}
.path button.cur{background:var(--accent);color:var(--accent-ink)}
.path button.cur.lost{background:var(--crit);color:var(--surface)}
.coach{display:flex;gap:8px;align-items:baseline;margin:10px 0 0;font-size:13px;color:var(--ink-2)}
.factors{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.factors li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:baseline}
.imp{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;color:var(--ink-3)}
.imp.pos{color:var(--good)}
.imp.neg{color:var(--crit)}
.hrow{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.tl li:first-child{border-top:0}
.tl .when{color:var(--ink-3);font-size:12.5px;font-variant-numeric:tabular-nums}
.tl .what{min-width:0}
.tl.wide li{grid-template-columns:150px minmax(0,1fr)}
.tl.wide .when{color:var(--accent);font-weight:600;font-size:12.5px}
.relmap svg{display:block;width:100%;min-width:640px;height:auto}
.relmap g[data-act]{cursor:pointer;outline:none}
.relmap g[data-act]:hover rect,.relmap g[data-act]:focus-visible rect{stroke-width:2.5}
@media (max-width:560px){.tl.wide li{grid-template-columns:minmax(0,1fr)}}
.due-crit{color:var(--crit);font-weight:600}
.due-warn{color:var(--warn);font-weight:600}
.due-good{color:var(--good)}

/* forms and messages */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;margin-top:8px}
.form .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2);min-width:0}

  if (c === 'rate_limited') return 'Claude is busy, or you’ve reached a usage limit. Try again in a minute.';

  if (c === 'invalid_json') return 'The answer came back in the wrong format. Try again.';

async function tilesOf(src, w, h, orig) {
  const LIMIT = 1600;
  if (Math.max(w, h) <= LIMIT && orig) return [orig];
  const cols = w > LIMIT ? 2 : 1, rows = h > LIMIT ? 2 : 1, ov = 0.05, out = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x0 = Math.max(0, Math.floor(c * w / cols - ov * w)), x1 = Math.min(w, Math.ceil((c + 1) * w / cols + ov * w));
    const y0 = Math.max(0, Math.floor(r * h / rows - ov * h)), y1 = Math.min(h, Math.ceil((r + 1) * h / rows + ov * h));
    const cv = document.createElement('canvas'); cv.width = x1 - x0; cv.height = y1 - y0;
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(src, x0, y0, x1 - x0, y1 - y0, 0, 0, cv.width, cv.height);

      else if (/\.(csv|txt)$/.test(nm) || /^text\//.test(f.type)) texts.push(`FILE ${f.name}\n${(await f.text()).slice(0, 30000)}`);
      else if (nm.endsWith('.pdf') || f.type === 'application/pdf') {
        say(`Opening ${f.name}…`);
        const pr = await pdfRead(f, 3);
        const hasText = pr.text.replace(/---.*---|\s/g, '').length > 80;
        if (hasText) texts.push(`FILE ${f.name} (text layer, ${pr.pages} page${pr.pages === 1 ? '' : 's'})\n${pr.text.slice(0, 30000)}`);
        if (imgLim) { for (const c of pr.canvases) { const t = await tilesOf(c, c.width, c.height); if (t.length > 1) tiled = true; images.push(...t); } }
        else if (!hasText) notes.push(`${f.name} looks scanned, and this view can’t send images to Claude.`);
        if (pr.pages > 3) notes.push(`${f.name}: only the first 3 of ${pr.pages} pages were read.`);
      } else if (/^image\//.test(f.type)) {
        if (!imgLim) { notes.push(`${f.name}: this view can’t send images to Claude.`); continue; }
        if (imgLim.mediaTypes && imgLim.mediaTypes.length && !imgLim.mediaTypes.includes(f.type)) { notes.push(`${f.name}: use JPG, PNG or WebP.`); continue; }
        if (imgLim.maxInputBytes && f.size > imgLim.maxInputBytes) { notes.push(`${f.name} is too large.`); continue; }
        const bmp = await decodeImage(f); const w = bmp.naturalWidth || bmp.width, h = bmp.naturalHeight || bmp.height;
        const t = await tilesOf(bmp, w, h, f); if (t.length > 1) tiled = true; images.push(...t);
      } else notes.push(`${f.name}: this file type isn’t supported.`);
    }
    const maxImgs = imgLim ? imgLim.maxCount || 0 : 0;
    if (images.length > maxImgs) { notes.push(`Only the first ${maxImgs} image parts were sent; check the later pages yourself.`); images.length = maxImgs; }
    if (!images.length && !texts.length) { out.innerHTML = `<p class="err">${esc(notes.join(' ') || 'Nothing readable was found.')}</p>`; return; }
    say('Claude is reading the items and matching your catalogue… this can take a minute or two.');
    const r = DEMO ? await demoRun(() => demoBoq()) : await ai.json(boqPrompt(texts, images.length, tiled), images.length ? {images, modelTier:'default'} : {modelTier:'default'});
    boqRes = normalizeBoq(r); boqRes.notes = notes;
    renderBoq();
  } catch (e) {
    console.warn('boq', e);
    out.innerHTML = `<p class="err">${esc(e && e.code ? (aiErr(e) || 'Stopped.') : 'Couldn’t read that file here. Try a photo or screenshot of the page, or paste the text.')}</p>`;
  } finally { if (btn && btn.isConnected) btn.disabled = false; }
}
async function boqCreate() {

async function rfqRead() {
  const ta = $('#rfq-text'); const text = ta ? ta.value.trim() : '';
  const out = $('#rfq-out'); if (!out) return;
  if (!text) { out.innerHTML = '<p class="err">Paste the email text first.</p>'; return; }
  if (!ai) { out.innerHTML = '<p class="err">Claude isn’t available in this view.</p>'; return; }
  out.innerHTML = '<p class="muted">Reading the RFQ and matching your catalogue… this can take up to a minute.</p>';
  const catalog = all('products').map(p => `${p.sku} | ${p.name} | ${p.family} | unit ${p.unit}`).join('\n');
  const customers = all('accounts').map(a => `${a.name} (${a.city || ''}, ${a.state || ''})`).join('\n');
  const prompt = `Extract a request for quotation from the email below for a manufacturer.
Catalogue (SKU | name | family | unit):
${catalog}

Known customers:
${customers}

Email:
"""
${text.slice(0, 12000)}
"""

Reply with only JSON in this shape:
{"customer":"exact name from Known customers if one clearly matches, else the company name in the email, or null","lines":[{"sku":"a SKU from the catalogue, or null if nothing fits","qty":150,"asked":"the customer's own wording for the item"}],"deliveryNote":"delivery place and date if given, else null"}
Match on size, type and material. Use null for sku rather than guessing a poor match.`;
  try {
    const r = DEMO ? await demoRun(() => demoRfq(text)) : await ai.json(prompt, {modelTier:'default'});
    const res = {customer: r && r.customer ? String(r.customer) : '', deliveryNote: r && r.deliveryNote ? String(r.deliveryNote) : '', lines: (r && Array.isArray(r.lines) ? r.lines : []).slice(0, 30).map(l => ({sku: l && l.sku ? String(l.sku) : '', qty: Math.max(1, Math.round(Number(l && l.qty) || 1)), asked: String((l && l.asked) || '')}))};
    const accs = all('accounts').sort((x, y) => x.name.localeCompare(y.name));

function changeSet(q) {

/* ---------- search / command bar ---------- */
function renderCmd() {
  const d = $('#cmd-drop'); const q = UI.cmd.trim().toLowerCase();
  if (!UI.cmdOpen || !q || !ready()) { d.hidden = true; d.innerHTML = ''; return; }
  const hits = [];
  all('accounts').forEach(a => { if ([a.name, a.city, a.gstin].join(' ').toLowerCase().includes(q)) hits.push(['acc', a.id, a.name, 'Account']); });
  all('opps').forEach(o => { if (o.name.toLowerCase().includes(q)) hits.push(['opp', o.id, o.name, 'Opportunity']); });
  all('leads').forEach(l => { if ([l.company, l.contactName].join(' ').toLowerCase().includes(q)) hits.push(['lead', l.id, l.company, 'Lead']); });
  all('quotes').forEach(x => { if (String(x.number).toLowerCase().includes(q) && x.status !== 'Superseded') hits.push(['quote', x.id, `${x.number} · ${accName(x.accountId)}`, 'Quote']); });
  all('contacts').forEach(c => { if (c.name.toLowerCase().includes(q)) hits.push(['con', c.id, `${c.name} · ${accName(c.primaryAccountId)}`, 'Contact']); });
  d.innerHTML = hits.slice(0, 8).map(h => `<button type="button" data-act="cmdOpen" data-kind="${h[0]}" data-id="${esc(h[1])}"><span>${esc(h[2])}</span><span class="k">${h[3]}</span></button>`).join('') + (ai ? `<button type="button" class="ask" data-act="cmdAsk"><span>Ask Claude: “${esc(UI.cmd.trim())}”</span><span class="k">Enter</span></button>` : (hits.length ? '' : '<p class="muted small" style="margin:6px 10px">No matches.</p>'));
  d.hidden = false;
}
